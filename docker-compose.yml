# Local check of the production image. Dokploy builds from the Dockerfile
# directly; set ARBITER_PIN and the /app/data volume there as well.
services:
  chess-swiss:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chess-swiss
    restart: unless-stopped
    environment:
      ARBITER_PIN: ${ARBITER_PIN:-change-me}
    ports:
      - "9010:9010"
    volumes:
      - chess-swiss-data:/app/data

volumes:
  chess-swiss-data:
